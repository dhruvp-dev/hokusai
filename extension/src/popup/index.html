<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hokusai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="modal-card">
    <!-- HEADER -->
    <div class="popup-header">
      <div class="brand-block">
        <div class="brand-title">
          <span id="logo-icon" class="brand-logo"></span>
          <span class="brand-name">Hokusai Capture</span>
        </div>
        <div class="brand-subtitle">Select capture options from the list</div>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" title="Toggle Theme"></button>
        <button id="btn-settings" class="icon-btn" title="Settings"></button>
      </div>
    </div>

    <!-- CURRENT TAB CONTEXT -->
    <div class="tab-context">
      <span class="tab-favicon" id="tab-favicon-icon"></span>
      <span class="tab-label">Target:</span>
      <span id="current-tab-url" class="tab-url">—</span>
    </div>

    <!-- MAIN BODY -->
    <div class="popup-body">

      <!-- CAPTURE CHOICES (3-COLUMN VISUAL CARDS) -->
      <section>
        <div class="capture-grid">
          <div id="act-visible" class="action-card active">
            <div class="wireframe-box">
              <div class="wf-visible-box"></div>
            </div>
            <span class="card-title">Visible</span>
            <span class="card-shortcut">⌘1</span>
          </div>
          <div id="act-fullpage" class="action-card">
            <div class="wireframe-box">
              <div class="wf-fullpage-lines">
                <div class="wf-line"></div>
                <div class="wf-line"></div>
                <div class="wf-line"></div>
              </div>
            </div>
            <span class="card-title">Full Page</span>
            <span class="card-shortcut">⌘2</span>
          </div>
          <div id="act-responsive" class="action-card">
            <div class="wireframe-box">
              <div class="wf-responsive-devices">
                <div class="dev-mon"></div>
                <div class="dev-mob"></div>
              </div>
            </div>
            <span class="card-title">Responsive</span>
            <span class="card-shortcut">⌘3</span>
          </div>
        </div>
      </section>

      <!-- FRAME STYLE -->
      <section>
        <div class="section-header">
          <span class="section-label">Frame Style</span>
        </div>
        <div class="frame-grid" id="frame-chips">
          <div class="frame-card active" data-style="arc">
            <span class="frame-label">Arc</span>
          </div>
          <div class="frame-card" data-style="firefox">
            <span class="frame-label">Firefox</span>
          </div>
          <div class="frame-card" data-style="minimal">
            <span class="frame-label">Minimal</span>
          </div>
          <div class="frame-card" data-style="none">
            <span class="frame-label">None</span>
          </div>
        </div>
      </section>

      <!-- BACKGROUND PRESETS -->
      <section>
        <div class="section-header">
          <span class="section-label">Background Preset</span>
        </div>
        <div class="preset-grid" id="bg-presets">
          <div class="preset-card active" data-bg="dark">
            <span class="preset-swatch swatch-dark"></span>
            <span class="preset-label">Dark</span>
          </div>
          <div class="preset-card" data-bg="hyper">
            <span class="preset-swatch swatch-hyper"></span>
            <span class="preset-label">Hyper</span>
          </div>
          <div class="preset-card" data-bg="midnight">
            <span class="preset-swatch swatch-midnight"></span>
            <span class="preset-label">Midnight</span>
          </div>
          <div class="preset-card" data-bg="sunset">
            <span class="preset-swatch swatch-sunset"></span>
            <span class="preset-label">Sunset</span>
          </div>
          <div class="preset-card" data-bg="glass">
            <span class="preset-swatch swatch-glass"></span>
            <span class="preset-label">Glass</span>
          </div>
        </div>
      </section>

      <!-- CANVAS PADDING -->
      <section>
        <div class="section-header">
          <div class="section-header-flex">
            <span class="section-label">Canvas Padding</span>
            <span id="padding-val-badge" class="badge-val">40px</span>
          </div>
        </div>
        <div class="slider-row">
          <input type="range" id="input-padding" min="16" max="96" step="4" value="40" class="range-slider">
        </div>
      </section>

      <!-- FORMAT -->
      <section>
        <div class="section-header">
          <span class="section-label">Format</span>
        </div>
        <div class="chip-row" id="format-chips">
          <button class="chip active" data-format="webp">WebP</button>
          <button class="chip" data-format="png">PNG</button>
        </div>
      </section>

      <!-- LATEST CAPTURE PREVIEW -->
      <div id="preview-section" class="preview-container hidden">
        <div class="section-header">
          <span class="section-label">Latest Capture</span>
        </div>
        <div class="preview-card">
          <div class="preview-canvas-wrapper">
            <img id="preview-img" class="preview-canvas" alt="Preview">
          </div>
          <div class="preview-actions">
            <button id="btn-copy" class="btn-primary">Copy Image</button>
            <button id="btn-download" class="btn-secondary">Download</button>
          </div>
        </div>
      </div>

      <!-- RECENT CAPTURES -->
      <section id="recent-section" class="recent-container">
        <div class="section-header">
          <div class="section-header-flex">
            <span class="section-label">Recent Captures</span>
            <button id="btn-clear-history" class="btn-clear-link" title="Clear all recent captures">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              <span>Clear All</span>
            </button>
          </div>
        </div>
        <div id="recent-list" class="recent-list"></div>
      </section>

    </div><!-- /.popup-body -->

    <div class="actions-footer">
      <button id="btn-submit-capture" class="btn-primary">
        <span>Capture Now</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <button id="btn-cancel-popup" class="btn-secondary">Cancel</button>
    </div>

  </div><!-- /.modal-card -->

  <!-- SETTINGS DRAWER OVERLAY -->
  <div id="settings-drawer" class="drawer-overlay hidden">
    <div class="drawer-card">
      <div class="drawer-header">
        <span class="drawer-title">Extension Settings</span>
        <button id="btn-close-settings" class="icon-btn" title="Close Settings">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="setting-item">
          <label class="setting-label">Default Format</label>
          <select id="setting-default-format" class="select-input">
            <option value="webp">WebP (Optimized)</option>
            <option value="png">PNG (Lossless)</option>
          </select>
        </div>
        <div class="setting-item">
          <div class="setting-label-row">
            <label class="setting-label">Image Quality</label>
            <span id="quality-val-badge" class="badge-val">90%</span>
          </div>
          <input type="range" id="setting-quality" min="50" max="100" step="5" value="90" class="range-slider">
        </div>
        <div class="setting-item">
          <div class="setting-label-row">
            <label class="setting-label">Canvas Padding</label>
            <span id="drawer-padding-val-badge" class="badge-val">40px</span>
          </div>
          <input type="range" id="setting-padding" min="16" max="96" step="4" value="40" class="range-slider">
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.bundle.js"></script>
</body>
</html>

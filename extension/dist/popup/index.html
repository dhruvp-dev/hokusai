<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hokusai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="modal-card">
    <!-- HEADER -->
    <div class="popup-header">
      <div class="brand-block">
        <div class="brand-title">
          <span id="logo-icon" class="brand-logo"></span>
          <span class="brand-name">Hokusai Capture</span>
        </div>
        <div class="brand-subtitle">Select capture options from the list</div>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" title="Toggle Theme"></button>
        <button id="btn-settings" class="icon-btn" title="Settings"></button>
      </div>
    </div>

    <!-- CURRENT TAB CONTEXT -->
    <div class="tab-context">
      <span class="tab-favicon" id="tab-favicon-icon"></span>
      <span class="tab-label">Target:</span>
      <span id="current-tab-url" class="tab-url">—</span>
    </div>

    <!-- MAIN BODY -->
    <div class="popup-body">

      <!-- CAPTURE CHOICES (CHECKBOX STYLE LIKE REFERENCE IMAGE) -->
      <section>
        <div class="capture-list">
          <div id="act-visible" class="action-card">
            <div class="card-checkbox">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="card-text">
              <span class="card-title">Visible Area</span>
              <span class="card-desc">Current Viewport</span>
            </div>
          </div>
          <div id="act-fullpage" class="action-card unchecked">
            <div class="card-checkbox">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="card-text">
              <span class="card-title">Full Page</span>
              <span class="card-desc">Entire Document</span>
            </div>
          </div>
          <div id="act-responsive" class="action-card unchecked">
            <div class="card-checkbox">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="card-text">
              <span class="card-title">Responsive</span>
              <span class="card-desc">Multi Device</span>
            </div>
          </div>
        </div>
      </section>

      <!-- FRAME STYLE -->
      <section>
        <div class="section-header">
          <span class="section-label">Frame Style</span>
        </div>
        <div class="frame-grid" id="frame-chips">
          <div class="frame-card active" data-style="arc">
            <span class="frame-label">Arc</span>
          </div>
          <div class="frame-card" data-style="firefox">
            <span class="frame-label">Firefox</span>
          </div>
          <div class="frame-card" data-style="minimal">
            <span class="frame-label">Minimal</span>
          </div>
          <div class="frame-card" data-style="none">
            <span class="frame-label">None</span>
          </div>
        </div>
      </section>

      <!-- FORMAT -->
      <section>
        <div class="section-header">
          <span class="section-label">Format</span>
        </div>
        <div class="chip-row" id="format-chips">
          <button class="chip active" data-format="webp">WebP</button>
          <button class="chip" data-format="png">PNG</button>
        </div>
      </section>

      <!-- LATEST CAPTURE PREVIEW -->
      <div id="preview-section" class="preview-container hidden">
        <div class="section-header">
          <span class="section-label">Latest Capture</span>
        </div>
        <div class="preview-card">
          <div class="preview-canvas-wrapper">
            <img id="preview-img" class="preview-canvas" alt="Preview">
          </div>
          <div class="preview-actions">
            <button id="btn-copy" class="btn-primary">Copy Image</button>
            <button id="btn-download" class="btn-secondary">Download</button>
          </div>
        </div>
      </div>

    </div><!-- /.popup-body -->

    <div class="actions-footer">
      <button id="btn-submit-capture" class="btn-primary">
        <span>Capture Now</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <button id="btn-cancel-popup" class="btn-secondary">Cancel</button>
    </div>

  </div><!-- /.modal-card -->

  <script type="module" src="popup.bundle.js"></script>
</body>
</html>
